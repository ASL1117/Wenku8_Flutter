name: iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Toolchain
        run: |
          xcodebuild -version
          flutter --version
          xcrun simctl list devices available
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - name: Flutter tests including iPhone 17 Pro Max layouts
        run: flutter test test/adaptive_ui_test.dart test/feature_unification_ui_test.dart
      - name: Live read-only API probe
        run: python3 scripts/probe_wenku_api.py
      - name: Build arm64 device app
        run: flutter build ios --release --no-codesign
      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail
          app_path="$PWD/build/ios/iphoneos/Runner.app"
          xcrun lipo "$app_path/Runner" -verify_arch arm64
          test -d "$app_path/Frameworks/App.framework"
          test -d "$app_path/Frameworks/Flutter.framework"
          if find "$app_path" -name libcpp.so | grep -q .; then
            echo 'Unexpected Android runtime in iOS app'
            exit 1
          fi
          mkdir -p dist/ios/Payload
          cp -R "$app_path" dist/ios/Payload/
          cd dist/ios
          zip -q -r -y Wenku8-0.2.3-ios-arm64-unsigned.ipa Payload
          unzip -tq Wenku8-0.2.3-ios-arm64-unsigned.ipa
          shasum -a 256 Wenku8-0.2.3-ios-arm64-unsigned.ipa > SHA256SUMS.txt
          /usr/libexec/PlistBuddy -c Print Payload/Runner.app/Info.plist
      - uses: actions/upload-artifact@v4
        with:
          name: Wenku8-ios-arm64-unsigned
          path: |
            dist/ios/*.ipa
            dist/ios/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Native bridge tests on iPhone 17 Pro Max simulator
        timeout-minutes: 20
        run: |
          set -euo pipefail
          echo 'Selecting the newest available iPhone 17 Pro Max runtime'
          mkdir -p build/ios
          xcrun simctl list devices available -j > build/ios/devices.json
          device_id=$(python3 -c 'import json,re; devices=json.load(open("build/ios/devices.json"))["devices"]; choices=[(tuple(map(int,re.findall(r"\d+",runtime))),d["udid"]) for runtime,group in devices.items() for d in group if d["name"]=="iPhone 17 Pro Max"]; print(max(choices)[1])')
          echo "Selected simulator: $device_id"
          echo "IOS_TEST_DEVICE=$device_id" >> "$GITHUB_ENV"
          flutter build ios --simulator --debug
          set +e
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -destination "platform=iOS Simulator,id=$device_id" -destination-timeout 120 -parallel-testing-enabled NO -only-testing:RunnerTests -resultBundlePath build/ios/BridgeTests.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | tee build/ios/native-tests.log
          test_status=${PIPESTATUS[0]}
          set -e
          tail -n 100 build/ios/native-tests.log
          xcrun xcresulttool get test-results summary --path build/ios/BridgeTests.xcresult | tee build/ios/native-test-summary.json || true
          test "$test_status" -eq 0
      - name: Live Dart to iOS channel test
        if: ${{ !cancelled() && env.IOS_TEST_DEVICE != '' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # Xcode shuts down its test simulator; Flutter discovers booted devices only.
          xcrun simctl list devices available -j > build/ios/devices-after-tests.json
          state=$(python3 -c 'import json,os; devices=json.load(open("build/ios/devices-after-tests.json"))["devices"]; print(next(d["state"] for group in devices.values() for d in group if d["udid"]==os.environ["IOS_TEST_DEVICE"]))')
          if [ "$state" != Booted ]; then
            xcrun simctl boot "$IOS_TEST_DEVICE"
          fi
          open -a Simulator --args -CurrentDeviceUDID "$IOS_TEST_DEVICE"
          xcrun simctl bootstatus "$IOS_TEST_DEVICE" -b
          flutter devices --device-timeout 60
          flutter test integration_test/api_probe_test.dart --no-pub -d "$IOS_TEST_DEVICE" --plain-name '真实目录与章节正文可加载'
      - name: Save native test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-test-results
          path: |
            build/ios/BridgeTests.xcresult
            build/ios/native-tests.log
            build/ios/native-test-summary.json
          if-no-files-found: ignore
          retention-days: 7
